<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Next Page Transition</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700;900&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #e8ecf1;
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* 🖼️ 동일한 배경 이미지 경로 */
    .bg-flame {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('images/bg.png');
      background-size: cover;
      background-position: center;
      z-index: 1;
    }

    /* 🌪️ 동일한 잿가루 파티클 캔버스 */
    #ash-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    /* 📦 버튼과 텍스트를 세로로 정렬하는 중앙 래퍼 박스 */
    .center-content-wrapper {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* 🔘 페이지 중앙 다음 페이지 이동 버튼 */
    .next-btn-container {
      cursor: pointer;
      display: inline-block;
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .next-btn-container:hover {
      transform: scale(1.08);
      filter: brightness(1.15);
    }

    .next-btn-img {
      display: block;
      width: clamp(120px, 15vw, 220px); /* 버튼 크기 반응형 조절 */
      height: auto;
      object-fit: contain;
    }

    /* 📝 이미지 바로 아래에 위치할 안내 텍스트 스타일 */
    .optimization-notice {
      color: #171717;
      margin-top: 20px;
      font-size: 1rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="bg-flame"></div>
  <!-- 🌪️ 파티클 캔버스 -->
  <canvas id="ash-canvas"></canvas>

  <!-- 📦 이미지 버튼과 안내 텍스트를 감싸는 중앙 정렬 래퍼 -->
  <div class="center-content-wrapper">
    <!-- 🔘 중앙 다음 페이지 이동 이미지 버튼 -->
    <a href="main.html" class="next-btn-container" title="다음 페이지로">
      <img src="images/next.png" alt="Next Page" class="next-btn-img">
    </a>

    <!-- 📝 이미지 바로 아래 줄바꿈되어 배치되는 텍스트 -->
    <p class="optimization-notice">이 페이지는 1920*1080 해상도의 크롬 PC환경에 최적화 되어있습니다.</p>
  </div>

  <script>
    /* ==========================================
       🌪️ 우하단 -> 좌상단 고속 대각선 잿가루 파티클 엔진
    ========================================== */
    const canvas = document.getElementById('ash-canvas');
    const ctx = canvas.getContext('2d');

    let particles = [];
    const maxParticles = 60; // 잿가루 파편 수

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class AshParticle {
      constructor() {
        this.reset();
      }

      reset() {
        this.x = canvas.width + Math.random() * 300;
        this.y = canvas.height + Math.random() * 200;
        this.speedX = -(Math.random() * 4 + 3); 
        this.speedY = -(Math.random() * 3 + 2);
        this.width = Math.random() * 4 + 1.5;
        this.height = Math.random() * 2 + 1;
        this.angle = Math.random() * Math.PI;
        this.spin = (Math.random() - 0.5) * 0.1;
        this.opacity = Math.random() * 0.6 + 0.2;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.angle += this.spin;

        if (this.x < -50 || this.y < -50) {
          this.reset();
        }
      }

      draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);
        ctx.globalAlpha = this.opacity;
        ctx.fillStyle = '#171717';
        ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);
        ctx.restore();
      }
    }

    for (let i = 0; i < maxParticles; i++) {
      let p = new AshParticle();
      p.x = Math.random() * canvas.width;
      p.y = Math.random() * canvas.height;
      particles.push(p);
    }

    function animateAsh() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateAsh);
    }
    animateAsh();
  </script>
</body>
</html>
